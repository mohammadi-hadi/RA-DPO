[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-dpo"
description = "Reliability-aware preference optimization and selective prediction for sexism detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hadi Mohammadi" }]
keywords = [
  "dpo",
  "preference-optimization",
  "selective-prediction",
  "abstention",
  "annotator-disagreement",
  "reliability",
  "sexism-detection",
  "llm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local = [
  "torch>=2.0",
  "transformers>=4.36",
  "datasets>=2.14",
  "accelerate>=0.24",
  "peft>=0.6",
  "trl>=0.7",
  "sentence-transformers>=2.2",
]
cuda = ["bitsandbytes>=0.41"]
explain = ["shap>=0.43", "torch>=2.0"]
tracking = ["wandb>=0.15"]
all = ["ra-dpo[openai,local,explain,tracking]"]

[project.scripts]
ra-dpo = "ra_dpo.cli:main"

[project.urls]
Repository = "https://github.com/mohammadi-hadi/RA-DPO"
Issues = "https://github.com/mohammadi-hadi/RA-DPO/issues"

[tool.setuptools.packages.find]
include = ["ra_dpo*"]

[tool.setuptools.dynamic]
version = { attr = "ra_dpo.__version__" }
